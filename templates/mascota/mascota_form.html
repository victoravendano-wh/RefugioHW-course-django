{%extends 'base/base.html'%}
{% load staticfiles %}

    

{% block content %}

<form method="post">
    {% csrf_token %}
    
    {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
        </div>
        {% if field.errors%}

        <label class="error-label"> {{field.errors.0}}</label>

        {% endif %}

    {% endfor %}

    <button class="btn btn-primary" type="submit">guardar</button>

</form>

{%endblock%}
