
{%extends 'base/base.html'%}

{%block header_title%}
	Eliminar registro de mascota
{%endblock%}

{%block nuevo_button%}  <!--eliminamos el boton "nuevo"-->
{%endblock%}


{%block content%}

<form method="post">

    {% csrf_token %}
    <h3>
        Desea eliminar la solicitud de {{mascota.nombre}}?

    </h3>

    <button class="btn btn-danger" type="submit">Eliminar</button>
    <a class="btn btn-default" href="{% url 'app mascotas:lista_mascotas'%}">Cancelar</a>
</form>

{%endblock%}
